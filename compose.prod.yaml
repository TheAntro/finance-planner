services:
  db:
    image: postgres:18.6
    env_file: .env
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./apps/backend
    env_file: .env
    mem_limit: 768m
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./apps/web
    env_file: .env
    depends_on:
      - backend
    restart: unless-stopped
    ports: ["127.0.0.1:3003:3000"]

volumes:
  db-data:
